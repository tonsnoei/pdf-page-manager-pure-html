<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-dark: #4f46e5;
    --accent-bg: #eef2ff;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 200ms cubic-bezier(.4,0,.2,1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--accent-dark);
  }

  .logo svg { flex-shrink: 0; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-counter {
    font-size: 13px;
    color: var(--text-muted);
    background: var(--accent-bg);
    border: 1px solid #c7d2fe;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 500;
    white-space: nowrap;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 2px rgba(99,102,241,.3);
  }

  .btn-primary:not(:disabled):hover {
    background: var(--accent-dark);
    box-shadow: 0 4px 12px rgba(99,102,241,.4);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:not(:disabled):hover {
    background: var(--bg);
    border-color: #cbd5e1;
  }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #fecaca;
  }

  .btn-danger:not(:disabled):hover {
    background: #fee2e2;
  }

  /* Main layout */
  .main { flex: 1; padding: 24px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    text-align: center;
  }

  .upload-zone {
    width: 100%;
    max-width: 520px;
    border: 2px dashed #c7d2fe;
    border-radius: 20px;
    padding: 52px 32px;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--surface);
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-bg);
    transform: scale(1.01);
  }

  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon {
    width: 72px; height: 72px;
    background: var(--accent-bg);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: var(--accent);
  }

  .upload-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .upload-sub { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
  .upload-sub strong { color: var(--accent); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(5, 1fr); } }

  /* Page card */
  .page-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow var(--transition), transform var(--transition);
    position: relative;
    cursor: grab;
    border: 2px solid transparent;
    user-select: none;
  }

  .page-card:hover {
    box-shadow: var(--shadow-md);
    border-color: #c7d2fe;
  }

  .page-card.dragging {
    opacity: .4;
    cursor: grabbing;
  }

  .page-card.drag-target-before { border-left: 3px solid var(--accent); }
  .page-card.drag-target-after  { border-right: 3px solid var(--accent); }

  /* Card thumbnail */
  .card-thumb {
    position: relative;
    background: #f1f5f9;
    aspect-ratio: 3/4;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-thumb canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Skeleton */
  .skeleton {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    position: absolute;
    inset: 0;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Card overlay (hover actions) */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,23,42,.45);
    opacity: 0;
    transition: opacity var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .page-card:hover .card-overlay { opacity: 1; }

  .overlay-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition), background var(--transition);
  }

  .overlay-btn:hover { transform: scale(1.15); }

  .btn-view { background: rgba(255,255,255,.9); color: var(--accent-dark); }
  .btn-rotate { background: rgba(255,255,255,.9); color: var(--accent-dark); }
  .btn-del  { background: rgba(239,68,68,.9); color: #fff; }

  /* Drag handle */
  .drag-handle {
    position: absolute;
    top: 8px; left: 8px;
    width: 26px; height: 26px;
    background: rgba(255,255,255,.85);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .page-card:hover .drag-handle { opacity: 1; }

  /* Page number badge */
  .page-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(15,23,42,.6);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
  }

  /* Card footer */
  .card-footer {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
  }

  .card-filename {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }

  .card-pagenum {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-top: 1px;
  }

  /* Progress overlay */
  .progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
  }

  .progress-overlay.active { opacity: 1; pointer-events: all; }

  .progress-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 36px 40px;
    text-align: center;
    box-shadow: var(--shadow-xl);
    min-width: 280px;
  }

  .progress-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .progress-card p  { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

  .progress-bar-wrap {
    background: var(--bg);
    border-radius: 20px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 20px;
    transition: width 200ms ease;
    width: 0%;
  }

  .progress-pct { font-size: 13px; font-weight: 600; color: var(--accent); }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.85);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
    padding: 20px;
  }

  .lightbox.active { opacity: 1; pointer-events: all; }

  .lightbox-inner {
    position: relative;
    max-width: min(90vw, 700px);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
  }

  .lightbox-inner canvas {
    border-radius: var(--radius);
    box-shadow: var(--shadow-xl);
    max-height: 80vh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: -14px; right: -14px;
    width: 36px; height: 36px;
    background: var(--surface);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    color: var(--text);
    z-index: 1;
  }

  .lightbox-label {
    text-align: center;
    margin-top: 12px;
    color: rgba(255,255,255,.7);
    font-size: 13px;
  }

  /* Touch drag ghost */
  .touch-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: .85;
    transform: scale(1.05);
    border-radius: var(--radius);
    box-shadow: var(--shadow-xl);
    background: var(--surface);
    overflow: hidden;
  }

  /* Drop insertion line */
  .drop-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    z-index: 10;
    pointer-events: none;
    display: none;
  }

  .drop-line.before { left: -2px; display: block; }
  .drop-line.after  { right: -2px; display: block; }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }

  .toast {
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 300ms ease;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Responsive header */
  @media (max-width: 500px) {
    .header { padding: 0 12px; }
    .logo span { display: none; }
    .btn { padding: 7px 12px; font-size: 13px; }
    .page-counter { font-size: 12px; padding: 3px 10px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="2" width="18" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
      <path d="M7 6h10M7 10h10M7 14h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>PDF Page Manager</span>
  </div>
  <div class="header-actions">
    <span class="page-counter" id="pageCounter">0 pages</span>
    <input type="file" id="addMoreInput" accept=".pdf" multiple hidden>
    <button class="btn btn-secondary" id="addMoreBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add More
    </button>
    <button class="btn btn-primary" id="downloadBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v9M3 7l4 4 4-4M1 11v1h12v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Download
    </button>
    <button class="btn btn-danger" id="clearAllBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Clear
    </button>
  </div>
</header>

<!-- Main -->
<main class="main">
  <div id="emptyState" class="empty-state">
    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf" multiple>
      <div class="upload-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M12 16V4m0 0l-4 4m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="upload-title">Drop PDF files here</h2>
      <p class="upload-sub">or click to browse. Supports multiple files.<br><strong>Pages can be reordered, rotated &amp; merged.</strong></p>
    </div>
  </div>

  <div id="gridWrap" style="display:none;">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="page-counter" id="gridCounter">0 pages</span>
      </div>
    </div>
    <div class="grid" id="pageGrid"></div>
  </div>
</main>

<!-- Progress -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-card">
    <h3 id="progressTitle">Processing…</h3>
    <p id="progressMsg">Please wait</p>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <canvas id="lightboxCanvas"></canvas>
    <div class="lightbox-label" id="lightboxLabel"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ─── Config & State ────────────────────────────────────────────────────────────
const state = {
  pages: [],
  pdfBytesCache: new Map(),
  pdfJsCache: new Map(),
  renderQueue: [],
  isRendering: false,
};

// ─── DOM refs ──────────────────────────────────────────────────────────────────
const fileInput      = document.getElementById('fileInput');
const addMoreInput   = document.getElementById('addMoreInput');
const addMoreBtn     = document.getElementById('addMoreBtn');
const downloadBtn    = document.getElementById('downloadBtn');
const clearAllBtn    = document.getElementById('clearAllBtn');
const dropZone       = document.getElementById('dropZone');
const emptyState     = document.getElementById('emptyState');
const gridWrap       = document.getElementById('gridWrap');
const pageGrid       = document.getElementById('pageGrid');
const pageCounter    = document.getElementById('pageCounter');
const gridCounter    = document.getElementById('gridCounter');
const progressOverlay= document.getElementById('progressOverlay');
const progressTitle  = document.getElementById('progressTitle');
const progressMsg    = document.getElementById('progressMsg');
const progressBar    = document.getElementById('progressBar');
const progressPct    = document.getElementById('progressPct');
const lightbox       = document.getElementById('lightbox');
const lightboxClose  = document.getElementById('lightboxClose');
const lightboxCanvas = document.getElementById('lightboxCanvas');
const lightboxLabel  = document.getElementById('lightboxLabel');

// ─── PDF.js setup ──────────────────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ─── Helpers ───────────────────────────────────────────────────────────────────
function getThumbScale(pdfPage) {
  const vp = pdfPage.getViewport({ scale: 1 });
  return 180 / vp.width;
}

function queueRender(page) {
  state.renderQueue.push(page);
  if (!state.isRendering) processQueue();
}

async function processQueue() {
  if (state.renderQueue.length === 0) { state.isRendering = false; return; }
  state.isRendering = true;
  const page = state.renderQueue.shift();
  await renderThumb(page);
  setTimeout(processQueue, 10);
}

function updateCounters() {
  const n = state.pages.length;
  const txt = `${n} page${n !== 1 ? 's' : ''}`;
  pageCounter.textContent = txt;
  gridCounter.textContent = txt;
  downloadBtn.disabled = n === 0;
  clearAllBtn.disabled = n === 0;
}

function showProgress(title, msg) {
  progressTitle.textContent = title;
  progressMsg.textContent   = msg;
  progressOverlay.classList.add('active');
  progressBar.style.width = '0%';
  progressPct.textContent = '0%';
}

function setProgress(pct) {
  progressBar.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function hideProgress() {
  progressOverlay.classList.remove('active');
}

// ─── Lightbox ──────────────────────────────────────────────────────────────────
async function openLightbox(pageId) {
  const page = state.pages.find(p => p.id === pageId);
  if (!page) return;
  const doc = state.pdfJsCache.get(page.fileName);
  if (!doc) return;

  const pdfPage = await doc.getPage(page.origPageNum);
  const vp = pdfPage.getViewport({ scale: 1 });
  const maxW = Math.min(window.innerWidth * 0.85, 680);
  const scale = maxW / vp.width;
  const viewport = pdfPage.getViewport({ scale, rotation: page.rotation });
  lightboxCanvas.width  = viewport.width;
  lightboxCanvas.height = viewport.height;
  await pdfPage.render({ canvasContext: lightboxCanvas.getContext('2d'), viewport }).promise;
  lightboxLabel.textContent = `${escapeHtml(page.fileName)} — Page ${page.origPageNum}`;
  lightbox.classList.add('active');
}

function closeLightbox() { lightbox.classList.remove('active'); }

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ─── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.getElementById('toastContainer').appendChild(toast);
  requestAnimationFrame(() => { toast.classList.add('show'); });
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 350);
  }, 2800);
}

// ─── Utility ───────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Core: Load Files ─────────────────────────────────────────────────────────
async function loadFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type === 'application/pdf');
  if (!files.length) return;

  showProgress('Loading PDFs…', 'Extracting pages');
  let loaded = 0;
  const total = files.length;

  for (const file of files) {
    try {
      const bytes = await file.arrayBuffer();
      state.pdfBytesCache.set(file.name, bytes);

      const loadingTask = pdfjsLib.getDocument({ data: bytes });
      const pdf = await loadingTask.promise;
      state.pdfJsCache.set(file.name, pdf);

      for (let i = 1; i <= pdf.numPages; i++) {
        state.pages.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}-${i}`,
          fileName: file.name,
          origPageNum: i,
          pageIndex: i - 1,
          rotation: 0,
        });
      }

      loaded++;
      setProgress(Math.round((loaded / total) * 100));
    } catch (err) {
      console.error('Failed to load', file.name, err);
      showToast(`Failed to load ${file.name}`);
    }
  }

  hideProgress();
  renderGrid();
  updateCounters();
  emptyState.style.display = 'none';
  gridWrap.style.display = 'block';
}

// ─── Core: Render Grid ────────────────────────────────────────────────────────
function renderGrid() {
  pageGrid.innerHTML = '';
  state.pages.forEach(page => {
    const card = createCard(page);
    pageGrid.appendChild(card);
    queueRender(page);
  });
}

function createCard(page) {
  const card = document.createElement('div');
  card.className = 'page-card';
  card.draggable = true;
  card.dataset.id = page.id;

  card.innerHTML = `
    <div class="drag-handle" title="Drag to reorder">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="3" cy="3" r="1.2" fill="currentColor"/><circle cx="9" cy="3" r="1.2" fill="currentColor"/><circle cx="3" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>
    </div>
    <div class="page-badge">${page.origPageNum}</div>
    <div class="card-thumb">
      <div class="skeleton" id="skel-${page.id}"></div>
      <canvas id="canvas-${page.id}" style="display:none;"></canvas>
      <div class="card-overlay">
        <button class="overlay-btn btn-view" data-id="${page.id}" title="View page">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="overlay-btn btn-rotate" data-id="${page.id}" title="Rotate page">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0111.47-2.3M14 8a6 6 0 01-11.47 2.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 2v4h-4M2 14v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="overlay-btn btn-del" data-id="${page.id}" title="Remove page">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="card-footer">
      <div class="card-filename" title="${escapeHtml(page.fileName)}">${escapeHtml(page.fileName)}</div>
      <div class="card-pagenum">Page ${page.origPageNum}</div>
    </div>
  `;

  // View
  card.querySelector('.btn-view').addEventListener('click', e => {
    e.stopPropagation();
    openLightbox(page.id);
  });

  // Rotate
  card.querySelector('.btn-rotate').addEventListener('click', e => {
    e.stopPropagation();
    rotatePage(page.id);
  });

  // Delete
  card.querySelector('.btn-del').addEventListener('click', e => {
    e.stopPropagation();
    removePage(page.id);
  });

  // Drag events
  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', page.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });

  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    clearDropIndicators();
  });

  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = card.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    clearDropIndicators();
    if (e.clientX < midX) {
      card.classList.add('drag-target-before');
    } else {
      card.classList.add('drag-target-after');
    }
  });

  card.addEventListener('dragleave', () => {
    card.classList.remove('drag-target-before', 'drag-target-after');
  });

  card.addEventListener('drop', e => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    if (!draggedId || draggedId === page.id) return;
    const rect = card.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    const before = e.clientX < midX;
    movePage(draggedId, page.id, before);
    clearDropIndicators();
  });

  // Touch drag support
  let touchClone = null;
  let touchStartX, touchStartY, touchCurrentX, touchCurrentY;
  let isDragging = false;

  card.addEventListener('touchstart', e => {
    if (e.target.closest('.overlay-btn')) return;
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    isDragging = false;
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (e.target.closest('.overlay-btn')) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (!isDragging && Math.abs(dx) + Math.abs(dy) > 10) {
      isDragging = true;
      touchClone = card.cloneNode(true);
      touchClone.classList.add('touch-ghost');
      touchClone.style.width = card.offsetWidth + 'px';
      touchClone.style.height = card.offsetHeight + 'px';
      document.body.appendChild(touchClone);
      card.style.opacity = '0.4';
    }
    if (isDragging) {
      e.preventDefault();
      touchCurrentX = t.clientX;
      touchCurrentY = t.clientY;
      touchClone.style.left = (touchCurrentX - card.offsetWidth / 2) + 'px';
      touchClone.style.top  = (touchCurrentY - card.offsetHeight / 2) + 'px';
      clearDropIndicators();
      const siblings = [...pageGrid.children];
      for (const sib of siblings) {
        if (sib === card) continue;
        const r = sib.getBoundingClientRect();
        const midX = r.left + r.width / 2;
        if (touchCurrentX >= r.left && touchCurrentX <= r.right && touchCurrentY >= r.top && touchCurrentY <= r.bottom) {
          sib.classList.add(touchCurrentX < midX ? 'drag-target-before' : 'drag-target-after');
        }
      }
    }
  }, { passive: false });

  card.addEventListener('touchend', e => {
    if (!isDragging) return;
    isDragging = false;
    if (touchClone) { touchClone.remove(); touchClone = null; }
    card.style.opacity = '1';
    clearDropIndicators();
    const t = e.changedTouches[0];
    const siblings = [...pageGrid.children];
    for (const sib of siblings) {
      if (sib === card) continue;
      const r = sib.getBoundingClientRect();
      const midX = r.left + r.width / 2;
      if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) {
        const before = t.clientX < midX;
        movePage(page.id, sib.dataset.id, before);
        break;
      }
    }
  });

  return card;
}

function clearDropIndicators() {
  document.querySelectorAll('.drag-target-before, .drag-target-after').forEach(el => {
    el.classList.remove('drag-target-before', 'drag-target-after');
  });
}

// ─── Core: Render Thumbnail ───────────────────────────────────────────────────
async function renderThumb(page, scale = null) {
  const canvas = document.getElementById(`canvas-${page.id}`);
  const skel   = document.getElementById(`skel-${page.id}`);
  if (!canvas) return;

  const doc = state.pdfJsCache.get(page.fileName);
  if (!doc) return;

  try {
    const pdfPage = await doc.getPage(page.origPageNum);
    const viewport = pdfPage.getViewport({ scale: scale || getThumbScale(pdfPage), rotation: page.rotation });
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    canvas.style.display = 'block';
    if (skel) skel.style.display = 'none';
  } catch(e) {
    if (skel) skel.style.display = 'none';
  }
}

// ─── Core: Page Operations ────────────────────────────────────────────────────
function rotatePage(id) {
  const page = state.pages.find(p => p.id === id);
  if (!page) return;
  page.rotation = (page.rotation + 90) % 360;
  queueRender(page);
}

function removePage(id) {
  state.pages = state.pages.filter(p => p.id !== id);
  renderGrid();
  updateCounters();
  if (state.pages.length === 0) {
    emptyState.style.display = 'flex';
    gridWrap.style.display = 'none';
  }
}

function movePage(draggedId, targetId, before) {
  const dragIdx = state.pages.findIndex(p => p.id === draggedId);
  const targetIdx = state.pages.findIndex(p => p.id === targetId);
  if (dragIdx === -1 || targetIdx === -1 || dragIdx === targetIdx) return;

  const [moved] = state.pages.splice(dragIdx, 1);
  const newTargetIdx = state.pages.findIndex(p => p.id === targetId);
  const insertAt = before ? newTargetIdx : newTargetIdx + 1;
  state.pages.splice(insertAt, 0, moved);
  renderGrid();
}

// ─── Core: Download Merged PDF ────────────────────────────────────────────────
async function downloadPDF() {
  if (!state.pages.length) return;
  showProgress('Merging PDF…', 'This may take a moment');
  setProgress(10);

  try {
    const { PDFDocument } = PDFLib;
    const outDoc = await PDFDocument.create();
    const total = state.pages.length;

    for (let i = 0; i < total; i++) {
      const page = state.pages[i];
      const bytes = state.pdfBytesCache.get(page.fileName);
      if (!bytes) continue;

      const src = await PDFDocument.load(bytes);
      const [copy] = await outDoc.copyPages(src, [page.pageIndex]);
      copy.setRotation({ angle: page.rotation });
      outDoc.addPage(copy);

      setProgress(10 + Math.round((i / total) * 85));
    }

    const pdfBytes = await outDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `merged_${Date.now()}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setProgress(100);
    setTimeout(hideProgress, 600);
    showToast('PDF downloaded successfully');
  } catch (err) {
    console.error(err);
    hideProgress();
    showToast('Failed to merge PDF');
  }
}

// ─── Event wiring ──────────────────────────────────────────────────────────────
fileInput.addEventListener('change', e => loadFiles(e.target.files));
addMoreInput.addEventListener('change', e => loadFiles(e.target.files));
addMoreBtn.addEventListener('click', () => addMoreInput.click());
downloadBtn.addEventListener('click', downloadPDF);
clearAllBtn.addEventListener('click', () => {
  if (!confirm('Remove all pages?')) return;
  state.pages = [];
  state.pdfBytesCache.clear();
  state.pdfJsCache.clear();
  renderGrid();
  updateCounters();
  emptyState.style.display = 'flex';
  gridWrap.style.display = 'none';
});

// Drop zone
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFiles(e.dataTransfer.files);
});

// Global drag-over for page reordering (when dragging over grid background)
document.addEventListener('dragover', e => e.preventDefault());

// Prevent accidental file drops on the page grid background
pageGrid.addEventListener('dragover', e => e.preventDefault());
pageGrid.addEventListener('drop', e => e.preventDefault());
</script>
